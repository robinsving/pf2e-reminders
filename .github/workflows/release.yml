name: Create Release

# Runs when a version tag such as v0.1.0 is pushed. The tag must match the version in module.json.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check that the tag matches the module version
        run: |
          version=$(jq -r '.version' module.json)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Foundry expects module.json at the root of the zip
      - name: Zip the built module
        run: cd dist && zip -r ../pf2e-reminders-release.zip .

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './dist/module.json,./pf2e-reminders-release.zip'
